name: Build Executables

on:
  push:
    tags:
      - "v*.*.*" # Se ejecutará al subir un tag como v1.0.0
  workflow_dispatch: # Permite ejecutar el flujo manualmente desde la web de GitHub

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
        
    - name: Build with PyInstaller
      run: pyinstaller --noconsole --onefile gui.py
      
    - name: Rename Executable (Windows)
      if: matrix.os == 'windows-latest'
      run: mv dist/gui.exe dist/Quiron-Windows.exe
      
    - name: Rename Executable (Linux/Mac)
      if: matrix.os != 'windows-latest'
      run: mv dist/gui dist/Quiron-${{ runner.os }}
      
    - name: Publish Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
